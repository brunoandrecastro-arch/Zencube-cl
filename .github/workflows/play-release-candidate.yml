name: ZenCube 5.0 unsigned AAB candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK Platform 36 and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platform-tools' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;28.1.13356709'
      - name: Install Godot 4.5.1 and bundletool
        shell: bash
        run: |
          set -euo pipefail
          download_dir=$(mktemp -d "$RUNNER_TEMP/zencube.XXXXXXXX")
          cd "$download_dir"
          godot_release=https://github.com/godotengine/godot/releases/download/4.5.1-stable
          curl -fsSL --retry 3 "$godot_release/Godot_v4.5.1-stable_linux.x86_64.zip" -o godot.zip
          curl -fsSL --retry 3 "$godot_release/Godot_v4.5.1-stable_export_templates.tpz" -o templates.tpz
          curl -fsSL --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o bundletool.jar
          sha256sum -c <<'CHECKSUMS'
          02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  godot.zip
          1998af37f1387684e2c211cdb483daf492fc64dc6b12096bddcdca25b6910c86  templates.tpz
          a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  bundletool.jar
          CHECKSUMS
          unzip -q godot.zip
          chmod +x Godot_v4.5.1-stable_linux.x86_64
          templates_dir="$HOME/.local/share/godot/export_templates/4.5.1.stable"
          mkdir -p "$templates_dir"
          unzip -joq templates.tpz 'templates/android_source.zip' 'templates/version.txt' -d "$templates_dir"
          printf 'GODOT=%s/Godot_v4.5.1-stable_linux.x86_64\nBUNDLETOOL_JAR=%s/bundletool.jar\n' \
            "$download_dir" "$download_dir" >> "$GITHUB_ENV"
      - name: Check Play preset 5.0 and disable development/QA flags
        run: |
          python3 - <<'PY'
          import configparser, json
          c=configparser.ConfigParser(interpolation=None); c.read('export_presets.cfg')
          p=next(x for x in c.sections() if c[x].get('name')=='"Android Play"')
          opt=c[p+'.options']
          assert opt['version/code']=='50'
          assert json.loads(opt['version/name'])=='5.0'
          assert json.loads(opt['package/unique_name'])=='com.zencube.game.play'
          assert c[p]['custom_features']=='""'
          assert opt['package/signed']=='false'
          assert opt['gradle_build/use_gradle_build']=='true'
          assert opt['gradle_build/export_format']=='1'
          assert json.loads(opt['gradle_build/target_sdk'])=='36'
          print('PRESET PASS. Package ID still needs verification in the existing Play Console.')
          PY
      - name: Extract premium Manhwa, portraits and Realm scenes
        run: |
          set -euo pipefail
          unzip -oq ZenCube_Abyss_Media_Pages.zip -d .
          unzip -oq ZenCube_Abyss_Media_Boss_Audio.zip -d .
          python3 tests/test_shadow_remake_media.py --extract
          unzip -oq ZenCube_2.0_Realm_Artwork.zip -d .
          python3 tests/test_campaign2_arenas.py --extract
          unzip -oq ZenCube_Ember_Media.zip -d .
          python3 tests/test_celestial_media.py --extract
          python3 - <<'PY'
          from pathlib import Path
          for stem in ('shadow_campaign','abyss_of_memories','ember_campaign','celestial_campaign'):
              root=Path('assets')/stem/'pages'
              files=sorted(root.glob('page_*.webp'))
              assert [p.name for p in files]==[f'page_{n:02d}.webp' for n in range(1,31)],(stem,len(files))
              print(stem, '30 ordered pages')
          for boss in ('mist_guardian','mirror_novice','veil_monk'):
              assert (Path('assets/shadow_campaign/portraits')/(boss+'.webp')).is_file(),boss
          PY
      - name: Run all repository regressions in isolated profiles
        run: |
          "$GODOT" --headless --editor --import --quit
          python3 scripts/test_play_release.py
      - name: Export and validate the unsigned release bundle
        run: bash scripts/build_play_aab.sh
      - name: Package unsigned ZenCube 3D 5.0 and record SHA-256
        run: |
          set -euo pipefail
          sha256sum build/ZenCube-3D-5.0-unsigned.aab | tee build/ZenCube-3D-5.0-SHA256.txt
          stat -c 'AAB size: %s bytes' build/ZenCube-3D-5.0-unsigned.aab | tee -a build/ZenCube-3D-5.0-SHA256.txt
          echo 'Candidate only: verify live Play package identifier, highest existing Play version code, and active upload certificate before signing.' >> build/ZenCube-3D-5.0-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ZenCube-3D-5.0-unsigned-candidate
          path: |
            build/ZenCube-3D-5.0-unsigned.aab
            build/ZenCube-3D-5.0-SHA256.txt
            build/release-tests/
            SIGN_ZENCUBE_5_0.ps1
          if-no-files-found: error
