name: Tag ZenCube 3D 2.0 final verified snapshot
on:
  push:
    branches: [milestone/zencube-3d-2-0-final-tagging]
permissions:
  contents: write
jobs:
  tag-final:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Create immutable final snapshot tag
        shell: bash
        env:
          FINAL_SHA: 60b97fd734aa4857bc93bc422255a7b576bcbdb1
          FINAL_TAG: zencube-3d-2.0-final
        run: |
          set -euo pipefail
          git cat-file -e "${FINAL_SHA}^{commit}"
          if git ls-remote --exit-code --tags origin "refs/tags/${FINAL_TAG}" > /dev/null 2>&1; then
            echo "Refusing to overwrite existing final tag" >&2
            exit 1
          fi
          git config user.name "ZenCube Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${FINAL_TAG}" "${FINAL_SHA}" -m "ZenCube 3D 2.0 final code snapshot, 17 Nov 2026. 90 checks green in PR #5 run 44143633582, Android package com.zencube.game.uitest versionCode 25. Play Store not published; Play upload requires separate review and signing."
          git push origin "refs/tags/${FINAL_TAG}"
          echo "Tag created: ${FINAL_TAG} -> ${FINAL_SHA}"
