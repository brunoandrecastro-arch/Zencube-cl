name: Zen Master 5x5 prototype checks
on:
  push:
    branches:
      - prototype/zen-master-5x5
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-5x5:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          echo "GODOT=/tmp/godot/Godot_v4.5.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project and validate scripts
        run: |
          "$GODOT" --headless --editor --import --quit
      - name: Verify 5x5 mechanics and standalone playable scene
        run: |
          timeout 70 "$GODOT" --headless --path . --script tests/test_zen_master_5x5.gd
      - name: Launch 3D prototype without modifying the main scene
        run: |
          timeout 40 "$GODOT" --headless --path . --quit-after 12 res://ZenMasterPrototype.tscn

  android-test-apk:
    needs: godot-5x5
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "build-tools;35.0.0" "platforms;android-35"
      - name: Install Godot 4.5.1 and Android templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          echo "GODOT=/tmp/godot/Godot_v4.5.1-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl -fsSL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -jq /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/version.txt' -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"
      - name: Isolate test scene and package in CI checkout ONLY
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path("project.godot")
          source = project.read_text()
          needle = 'run/main_scene="res://Main.tscn"'
          assert source.count(needle) == 1
          project.write_text(source.replace(needle, 'run/main_scene="res://ZenMasterPrototype.tscn"'))
          preset = Path("export_presets.cfg")
          source = preset.read_text()
          needle = 'package/unique_name="com.zencube.game"'
          assert source.count(needle) == 1
          source = source.replace(needle, 'package/unique_name="com.zencube.game.zenmaster"', 1)
          source = source.replace('package/name="ZenCube 3D"', 'package/name="Zen Master 5x5 Test"', 1)
          preset.write_text(source)
          assert 'package/unique_name="com.zencube.game.play"' in source
          print("Temporary Android debug package: com.zencube.game.zenmaster")
          PY
      - name: Export signed isolated debug APK
        run: |
          bash scripts/build_android.sh
          mv build/ZenCube-3D.apk build/ZenMaster-5x5-Test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZenMaster-5x5-Android-Test-APK
          path: build/ZenMaster-5x5-Test.apk
          if-no-files-found: error
