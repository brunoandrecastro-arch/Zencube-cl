name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ZENCUBE_CAMPAIGN_TEST: ${{ github.head_ref == 'feature/zen-chronicles-campaign-prologue' || github.ref_name == 'feature/zen-chronicles-campaign-prologue' }}
      ZENCUBE_REALM_CHRONICLES_TEST: ${{ github.head_ref == 'feature/zen-ascend-realm-chronicles' || github.ref_name == 'feature/zen-ascend-realm-chronicles' }}
      ZENCUBE_ABYSS_TEST: ${{ github.head_ref == 'feature/campaign-2-abyss-of-memories' || github.ref_name == 'feature/campaign-2-abyss-of-memories' || github.head_ref == 'feature/campaign-2-shadow-realm' || github.ref_name == 'feature/campaign-2-shadow-realm' || github.head_ref == 'feature/zencube-2-0-realm' || github.ref_name == 'feature/zencube-2-0-realm' || github.head_ref == 'feature/zencube-2-0-realm-feedback-fixes' || github.ref_name == 'feature/zencube-2-0-realm-feedback-fixes' || (github.head_ref == 'fix/campaign2-build337-feedback' || github.ref_name == 'fix/campaign2-build337-feedback' || github.head_ref == 'feature/zen-act1-integration-20261120' || github.ref_name == 'feature/zen-act1-integration-20261120') }}
      ZENCUBE_SHADOW_TEST: ${{ github.head_ref == 'feature/campaign-2-shadow-realm' || github.ref_name == 'feature/campaign-2-shadow-realm' || github.head_ref == 'feature/zencube-2-0-realm' || github.ref_name == 'feature/zencube-2-0-realm' || github.head_ref == 'feature/zencube-2-0-realm-feedback-fixes' || github.ref_name == 'feature/zencube-2-0-realm-feedback-fixes' || (github.head_ref == 'fix/campaign2-build337-feedback' || github.ref_name == 'fix/campaign2-build337-feedback' || github.head_ref == 'feature/zen-act1-integration-20261120' || github.ref_name == 'feature/zen-act1-integration-20261120') }}
      ZENCUBE_REALM_2_0_TEST: ${{ github.head_ref == 'feature/zencube-2-0-realm' || github.ref_name == 'feature/zencube-2-0-realm' || github.head_ref == 'feature/zencube-2-0-realm-feedback-fixes' || github.ref_name == 'feature/zencube-2-0-realm-feedback-fixes' || (github.head_ref == 'fix/campaign2-build337-feedback' || github.ref_name == 'fix/campaign2-build337-feedback' || github.head_ref == 'feature/zen-act1-integration-20261120' || github.ref_name == 'feature/zen-act1-integration-20261120') }}
      ZENCUBE_CELESTIAL_TEST: ${{ (github.head_ref == 'fix/campaign2-build337-feedback' || github.ref_name == 'fix/campaign2-build337-feedback' || github.head_ref == 'feature/zen-act1-integration-20261120' || github.ref_name == 'feature/zen-act1-integration-20261120') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "build-tools;35.0.0" "platforms;android-35"
      - name: Godot and matching templates
        shell: bash
        run: |
          curl -fsSL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          echo "GODOT=/tmp/godot/Godot_v4.5.1-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl -fsSL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -jq /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/version.txt' -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"
      - name: Extract supplied Abyss art and original boss soundtracks
        if: env.ZENCUBE_ABYSS_TEST == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for archive in ZenCube_Abyss_Media_Pages.zip ZenCube_Abyss_Media_Boss_Audio.zip; do
            if [[ -f "$archive" ]]; then
              unzip -oq "$archive" -d .
            else
              echo "::notice::Upload $archive to this branch to complete the real Abyss APK"
            fi
          done
      - name: Extract original Shadow Realm 30 Manhwa pages
        if: env.ZENCUBE_SHADOW_TEST == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ZenCube_Shadow_Media_Pages.zip ]]; then
            unzip -oq ZenCube_Shadow_Media_Pages.zip -d .
          else
            echo "::notice::Upload ZenCube_Shadow_Media_Pages.zip to this branch to package the Shadow manhwa"
          fi
      - name: Extract ZenCube 2.0 Realm HD arenas and sneak preview
        if: env.ZENCUBE_REALM_2_0_TEST == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ZenCube_2.0_Realm_Artwork.zip ]]; then
            unzip -oq ZenCube_2.0_Realm_Artwork.zip -d .
            for p in assets/shadow_campaign/arenas/{mist_guardian,mirror_novice,veil_monk}.webp assets/zen_realm2/ascend_preview.webp; do
              test -s "$p" || { echo "::error::Missing expected preview/arena $p"; exit 1; }
            done
          else
            echo "::notice::HD arena/preview ZIP not yet uploaded; QA APK uses safe legacy backgrounds until media upload"
          fi
      - name: Extract final approved Campaign 2.0 arena ZIP
        if: env.ZENCUBE_REALM_2_0_TEST == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ZenCube_Campaign2_Final_Arenas.zip ]]; then
            python3 tests/test_campaign2_arenas.py --extract
          else
            echo "::warning::Final arena ZIP missing; source tests can run, but final APK export requires it"
          fi
      - name: Extract complete Ember Manhwa and portraits
        if: (github.head_ref == 'fix/campaign2-build337-feedback' || github.ref_name == 'fix/campaign2-build337-feedback' || github.head_ref == 'feature/zen-act1-integration-20261120' || github.ref_name == 'feature/zen-act1-integration-20261120')
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          root = pathlib.Path("assets/ember_campaign")
          expected = [root / "pages" / f"page_{n:02d}.webp" for n in range(1,31)]
          expected += [root / "realm.webp"] + [root / "bosses" / (x+".webp") for x in ("ash_runner","banner_guardian","ember_high_priest")]
          with zipfile.ZipFile("ZenCube_Ember_Media.zip") as z:
              assert z.testzip() is None
              for p in expected:
                  data = z.read(p.as_posix())
                  assert data[:4] == b"RIFF" and data[8:12] == b"WEBP", p
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(data)
          print("Verified and extracted all 34 Ember images")
          PY
      - name: Extract and verify Celestial 3.0 media
        if: env.ZENCUBE_CELESTIAL_TEST == 'true'
        run: python3 tests/test_celestial_media.py --extract
      - name: Import project and check GDScript
        run: |
          "$GODOT" --headless --editor --import --quit
      - name: Verify actual loaded boss arena paths and texture dimensions
        if: env.ZENCUBE_CELESTIAL_TEST == 'true'
        run: timeout 55 "$GODOT" --headless --path . --script tests/test_realm_arena_resolution.gd
      - name: Verify 108 lines and simulated games
        run: python3 tests/test_108_rules.py
      - name: Verify German/English strings and music WAV
        run: python3 tests/test_language_audio.py
      - name: Verify 100 Zen Challenges with forced lines and defense proofs
        run: python3 tests/test_challenges_data.py
      - name: Verify full German, English, Portuguese localization
        run: python3 tests/test_i18n_3_languages.py
      - name: Verify five localized Chronicles chapters and their artwork
        run: python3 tests/test_zen_chronicles_i18n.py
      - name: Verify natural game copy in three languages
        run: python3 tests/test_natural_copy.py
      - name: Verify premium home menu, result screen and Android haptics
        run: python3 tests/test_premium_ui_9_3.py
      - name: Verify welcome scroll, result controls and fairer Classic Hard
        run: python3 tests/test_welcome_result_hard_2026.py
      - name: Verify five Zen ranks, bot difficulties and new worlds
        run: python3 tests/test_zen_ascension.py
      - name: Verify premium world artwork and selection menu
        run: python3 tests/test_world_visuals_9_4_2.py
      - name: Verify one Zen quote per World in DE, EN and PT-PT
        run: python3 tests/test_zen_world_quotes.py
      - name: Check HD worlds, unlock hints, O visibility and result copy
        run: python3 tests/test_design_clarity_9_4_3.py
      - name: ZenCube 9.5 earned currency and 20 skins (static)
        run: python3 tests/test_zen_collection_9_5.py
      - name: Verify five new crisp worlds and 20 surface material maps
        run: python3 tests/test_premium_materials_9_6.py
      - name: Verify 9.6.1 high-resolution surfaces, touch shop and new audio loops
        run: python3 tests/test_quality_audio_9_6_1.py
      - name: Verify 1.0 audio tracks, store assets and Play metadata
        run: python3 tests/test_release_candidate_1_0.py
      - name: Verify new standalone Zen Ascend 4x4 rules, profiles and unlock logic (static)
        run: python3 tests/test_ascend_4x4.py
      - name: RC4 shop tabs and supplied soundtrack (static)
        run: python3 tests/test_rc4_music_tabs.py
      - name: RC5 titles, Zen Meister unlock and bot difficulty (static)
        run: python3 tests/test_rc5_titles_unlock.py
      - name: RC6 ensure separate test APK and public release unlock gates
        run: python3 tests/test_rc6_release_gate.py
      - name: World music policy migration and fixed IDs (static)
        run: python3 tests/test_world_music_static.py
      - name: World music and shop entitlements (headless)
        run: |
          timeout 55 "$GODOT" --headless --path . --script tests/test_world_music.gd
      - name: RC5 fair bot difficulty and tactical checks (headless)
        run: |
          timeout 65 "$GODOT" --headless --path . --script tests/test_rc5_bot_balance.gd
      - name: RC4 shop tabs and music purchases (headless)
        run: |
          timeout 65 "$GODOT" --headless --path . --script tests/test_rc4_music_tabs.gd
      - name: Verify Zen Music Shop and seven original tracks (static)
        run: python3 tests/test_music_shop_1_0_rc2.py
      - name: Verify Zen Music Shop purchases on real Godot scene (headless)
        run: |
          timeout 55 "$GODOT" --headless --path . --script tests/test_music_shop_1_0_rc2.gd
      - name: Verify five sound tracks on real Godot scene (headless)
        run: |
          timeout 65 "$GODOT" --headless --path . --script tests/test_release_candidate_1_0.gd
      - name: Test new paging and visual clarity on actual Godot scene (headless)
        run: |
          timeout 60 "$GODOT" --headless --path . --script tests/test_quality_audio_9_6_1.gd
      - name: Test actual material texture rendering (headless)
        run: |
          timeout 55 "$GODOT" --headless --path . --script tests/test_premium_materials_9_6.gd
      - name: ZenCube 9.5 economy, 3 tracks and shop on the real cube (headless)
        run: |
          timeout 55 "$GODOT" --headless --path . --script tests/test_zen_collection_9_5.gd
      - name: Verify premium world switching on the real cube (headless)
        run: |
          timeout 45 "$GODOT" --headless --path . --script tests/test_world_visuals_9_4_2.gd
      - name: World unlock explanation and high-density cube render (headless)
        run: |
          timeout 50 "$GODOT" --headless --path . --script tests/test_design_clarity_9_4_3.gd
      - name: Zen Ascension progression and five bot levels (headless)
        run: |
          timeout 75 "$GODOT" --headless --path . --script tests/test_zen_ascension.gd
      - name: Zen rank-up audiovisual ceremony assets and gating (static)
        run: python3 tests/test_zen_ceremony.py
      - name: Zen rank-up audiovisual ceremony (Godot headless)
        run: |
          timeout 45 "$GODOT" --headless --path . --script tests/test_zen_ceremony.gd
      - name: Check HD Realm backgrounds and bot rank defaults (static)
        run: python3 tests/test_zen_bot_auto.py
      - name: Test Zen bot rank defaults (headless)
        run: |
          timeout 40 "$GODOT" --headless --path . --script tests/test_zen_bot_auto.gd
      - name: Check Zen Ascend Realms assets, progression and interface (static)
        run: python3 tests/test_zen_ascend_realms.py
      - name: Verify fixed Realm bots, 8/8 transition and secret hint shop (static)
        run: python3 tests/test_ascend_fixed_realms_and_hints.py
      - name: Verify Ember bot syncing and Shadow Medium tuning (static)
        run: python3 tests/test_shadow_ember_bot_levels.py
      - name: Check strict Realm progression, possible challenges and portal scene
        run: python3 tests/test_zen_realm_portal.py
      - name: Test Realm Portal animation scene (headless)
        run: |
          timeout 40 "$GODOT" --headless --path . --script tests/test_zen_realm_portal.gd
      - name: Verify 32 Zen Ascend Realm challenges in Godot (headless)
        run: |
          timeout 70 "$GODOT" --headless --path . --script tests/test_zen_ascend_realms.gd
      - name: Zen Ascend independent achievements and choir (Godot headless)
        run: |
          timeout 55 "$GODOT" --headless --path . --script tests/test_zen_achievements_choir.gd
      - name: Check four Realm songs, Satori ceremony and post-Gong audio recovery
        run: python3 tests/test_realm_audio_ceremony.py
      - name: Four looping Realm songs and one-time Satori ceremony (Godot headless)
        run: |
          timeout 70 "$GODOT" --headless --path . --script tests/test_realm_audio_ceremony.gd
      - name: Test 96-cell Zen Ascend cube, 204 win lines and unlock logic (headless)
        run: |
          timeout 40 "$GODOT" --headless --path . --script tests/test_ascend_4x4.gd
      - name: Godot engine tests
        run: |
          "$GODOT" --headless --path . --script tests/test_engine.gd
      - name: Verify main scene and GameController script
        run: |
          timeout 35 "$GODOT" --headless --path . --script tests/test_scene_load.gd
      - name: Verify playable Zen Campaign and demon AI
        run: |
          timeout 45 "$GODOT" --headless --path . --script tests/test_zen_campaign.gd
      - name: Verify 12 original Realm boss music mappings and OGG import
        run: |
          timeout 55 "$GODOT" --headless --path . --script tests/test_realm_boss_music.gd
      - name: Verify playable 4x4 Realm Chronicles, bosses, skins, saves and gates
        run: |
          timeout 90 "$GODOT" --headless --path . --script tests/test_realm_chronicles.gd
      - name: Ember Temple – three real boss battles, chapter finale and QA-only gate
        run: |
          timeout 110 "$GODOT" --headless --path . --script tests/test_ember_chapter.gd
      - name: Celestial and Satori – six Master/Grandmaster battles and complete four-Realm finale
        run: |
          timeout 120 "$GODOT" --headless --path . --script tests/test_celestial_satori_chapters.gd
      - name: Four Realm chapter cards and Celestial/Satori QA navigation
        run: |
          timeout 50 "$GODOT" --headless --path . --script tests/test_realm_chapter_menu.gd
      - name: Verify approved Realm feedback - swipe, 4x4 return, 12 victories and shatter unlocks
        run: |
          timeout 90 "$GODOT" --headless --path . --script tests/test_realm_feedback_and_gates.gd
      - name: 'Test complete Abyss Campaign 2.0: pages, 3 boss gates, saves, 4 cube skins'
        run: |
          timeout 90 "$GODOT" --headless --path . --script tests/test_abyss_campaign.gd
      - name: Shadow Realm Campaign 2.0 – 30 pages, 3 original 4x4 bosses and story save
        run: |
          timeout 90 "$GODOT" --headless --path . --script tests/test_shadow_campaign.gd
      - name: 'ZenCube 2.0 Realm: real Zen-Bot Realm milestones, 4x4 gate and 3+3 chapter unlocks'
        run: |
          timeout 95 "$GODOT" --headless --path . --script tests/test_zen_realm_2_0.gd
      - name: Validate twelve original Boss track mappings and audio checksums
        run: python3 tests/test_realm_boss_audio.py
      - name: Verify 100 tactical challenges on the 3D cube
        run: |
          timeout 65 "$GODOT" --headless --path . --script tests/test_challenges.gd
      - name: Verify PCM music stream and playback controls
        run: |
          timeout 35 "$GODOT" --headless --path . --script tests/test_music_stream.gd
      - name: Godot UI and menu tests (headless)
        run: |
          timeout 65 "$GODOT" --headless --path . --script tests/test_ui.gd
      - name: Language switch and music playback smoke test
        run: |
          timeout 45 "$GODOT" --headless --path . --script tests/test_localized_ui.gd
      - name: Verify live world header, quote and language switching (headless)
        run: |
          timeout 50 "$GODOT" --headless --path . --script tests/test_zen_world_quotes.gd
      - name: Premium result screen and simplified main menu (headless)
        run: |
          timeout 60 "$GODOT" --headless --path . --script tests/test_result_screen.gd
      - name: Verify prequel Acts I–IV trials and independent progress
        run: timeout 100 "$GODOT" --headless --path . --script tests/test_zen_act_one.gd
      - name: Verify Moon-to-Shadow 3×3/4×4 cinematic and replay-safe checkpoint
        run: timeout 65 "$GODOT" --headless --path . --script tests/test_moon_shadow_transition.gd
      - name: Tactical simulations
        run: |
          g++ -O3 -std=c++17 tests/simulate.cpp -o /tmp/zencube-sim
          /tmp/zencube-sim reports/lines.json > reports/simulation.json
      # A stable debug key lets future Realm Chronicles test builds update
      # the SAME separately installed app, instead of creating a new signature
      # on every ephemeral runner. No Google Play/upload key is involved.
      - name: Reuse Realm Chronicles debug signing key
        if: env.ZENCUBE_REALM_CHRONICLES_TEST == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/zencube-debug.keystore
          key: zencube-realmchronicles-debug-key-v1
      - name: Require 30 pages, 3 boss portraits and 4 tracks for final Abyss APK
        if: env.ZENCUBE_ABYSS_TEST == 'true'
        shell: bash
        run: |
          set -euo pipefail
          count=$(find assets/abyss_of_memories/pages -type f -name 'page_*.webp' 2>/dev/null | wc -l)
          test "$count" -eq 30 || { echo "::error::30 Abyss Manhwa pages required, have $count"; exit 1; }
          for asset in assets/abyss_of_memories/realm.webp \
              assets/abyss_of_memories/bosses/{memory_thief,weeping_blade,forgotten_shogun}.webp \
              assets/abyss_of_memories/audio/{story,memory_thief,weeping_blade,forgotten_shogun}.mp3; do
            test -s "$asset" || { echo "::error::Missing Abyss media $asset"; exit 1; }
          done
      - name: Reuse Abyss debug signing key
        if: env.ZENCUBE_ABYSS_TEST == 'true' && env.ZENCUBE_SHADOW_TEST != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/zencube-debug.keystore
          key: zencube-abyss-debug-key-v1
      - name: Require all 30 Shadow Manhwa pages before APK publication
        if: env.ZENCUBE_SHADOW_TEST == 'true'
        shell: bash
        run: |
          set -euo pipefail
          count=$(find assets/shadow_campaign/pages -type f -name 'page_*.webp' 2>/dev/null | wc -l)
          test "$count" -eq 30 || { echo "::error::Shadow Realm needs 30 story pages; found $count"; exit 1; }
          test -s assets/realms/shadow_realm.webp
          for boss in mist_guardian mirror_novice veil_monk; do
            test -s "assets/realm_chronicles/boss_${boss}.json"
            test -s "assets/realm_boss_music/${boss}.ogg"
          done
          test -s assets/realm_music/shadow_realm.ogg
      - name: Reuse Shadow debug signing key
        if: env.ZENCUBE_SHADOW_TEST == 'true' && env.ZENCUBE_REALM_2_0_TEST != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/zencube-debug.keystore
          key: zencube-shadow-debug-key-v1
      - name: Reuse ZenCube 2.0 Realm debug signing key
        if: env.ZENCUBE_REALM_2_0_TEST == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/zencube-debug.keystore
          key: zencube-realm-2-0-debug-key-v1
      - name: Require verified final arena pack before Campaign 2.0 APK export
        if: env.ZENCUBE_REALM_2_0_TEST == 'true' && ((github.head_ref == 'fix/campaign2-build337-feedback' || github.ref_name == 'fix/campaign2-build337-feedback' || github.head_ref == 'feature/zen-act1-integration-20261120' || github.ref_name == 'feature/zen-act1-integration-20261120'))
        run: python3 tests/test_campaign2_arenas.py
      - name: Build debug APK
        run: bash scripts/build_android.sh
      - name: Verify music and Chronicles data included in APK
        shell: bash
        run: |
          set -euo pipefail
          apk_contents=$(unzip -Z1 build/ZenCube-3D.apk)
          for file in zen_ambient_music.pcm zen_bamboo_music.pcm zen_moon_music.pcm zen_flute_music.pcm zen_koto_music.pcm zen_regentropfen_music.pcm zen_sternenlicht_music.pcm; do
            grep -Fx "assets/assets/$file" <<< "$apk_contents"
          done
          for file in chronicles.json localization.json settings.json; do
            grep -Fx "assets/story/$file" <<< "$apk_contents"
          done
          grep -Fx 'assets/story/zen_campaign.json' <<< "$apk_contents"
          for boss in mist_guardian mirror_novice veil_monk ash_runner banner_guardian ember_high_priest wind_scribe bridge_sentinel sky_archivist lotus_witness halo_keeper fully_aware; do
            grep -Fx "assets/assets/realm_chronicles/boss_${boss}.json" <<< "$apk_contents"
          done
          for file in $(git ls-files 'assets/zen_campaign/*.webp'); do
            grep -Fx "assets/$file.import" <<< "$apk_contents"
          done
      - name: Verify native Abyss media included in debug APK
        if: env.ZENCUBE_ABYSS_TEST == 'true'
        shell: bash
        run: |
          set -euo pipefail
          contents=$(unzip -Z1 build/ZenCube-3D.apk)
          grep -F "assets/assets/abyss_of_memories/pages/page_01.webp" <<< "$contents"
          grep -F "assets/assets/abyss_of_memories/pages/page_30.webp" <<< "$contents"
          grep -F "assets/assets/abyss_of_memories/bosses/forgotten_shogun.webp" <<< "$contents"
          grep -F "assets/assets/abyss_of_memories/audio/forgotten_shogun.mp3" <<< "$contents"
      - name: Verify 30 Shadow pages and Boss assets inside APK
        if: env.ZENCUBE_SHADOW_TEST == 'true'
        shell: bash
        run: |
          set -euo pipefail
          contents=$(unzip -Z1 build/ZenCube-3D.apk)
          grep -F 'assets/assets/shadow_campaign/pages/page_01.webp' <<< "$contents"
          grep -F 'assets/assets/shadow_campaign/pages/page_30.webp' <<< "$contents"
          grep -F 'assets/assets/realm_boss_music/mist_guardian.ogg' <<< "$contents"
          grep -F 'assets/assets/realm_boss_music/veil_monk.ogg' <<< "$contents"
      - name: Verify seven final arena textures inside APK
        if: env.ZENCUBE_REALM_2_0_TEST == 'true' && ((github.head_ref == 'fix/campaign2-build337-feedback' || github.ref_name == 'fix/campaign2-build337-feedback' || github.head_ref == 'feature/zen-act1-integration-20261120' || github.ref_name == 'feature/zen-act1-integration-20261120'))
        run: python3 tests/test_campaign2_arenas.py --apk build/ZenCube-3D.apk
      - name: Verify 34 Ember images in APK
